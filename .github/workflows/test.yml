name: PlainMap tests

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fastp bwa samtools

      - name: Run smoke and regression tests
        run: bash tests/run_tests.sh
